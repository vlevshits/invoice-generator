[package]
name = "invoice-generator"
version = "1.0.5"
description = "Desktop application for generating, tracking, and exporting invoices"
authors = ["Desktop Developer"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "InvoiceGenerator"
path = "src/main.rs"

[lib]
name = "invoice_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.2.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-opener = "2.2.0"
tauri-plugin-store = "2.2.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
tiny_http = "0.12"
open = "5"
chrono = "0.4"
sha2 = "0.10"
base64 = "0.22"
