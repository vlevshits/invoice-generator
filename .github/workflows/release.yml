name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Typst CLI
        uses: typst-community/setup-typst@v3
        with:
          version: 'v0.13.0'

      - name: Copy Typst Binary into Bundle Resources
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          TYPST_PATH=$(which typst || echo "")
          if [ -n "$TYPST_PATH" ]; then
            cp "$TYPST_PATH" src-tauri/bin/
            chmod +x src-tauri/bin/* || true
          fi

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsqlite3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: v__VERSION__ # tauri-action automatically replaces this with app version from tauri.conf.json
          releaseName: 'Invoice Generator v__VERSION__'
          releaseBody: 'See release notes for full list of changes.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
